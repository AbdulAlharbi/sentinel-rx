[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-rx"
version = "0.1.0"
description = "Security-aware agentic recovery of a failing enterprise system, plus a reproducible benchmark."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "joblib==1.6.0",
  "PyYAML==6.0.3",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.setuptools]
packages = ["env", "env.sim", "env.live", "faults", "scenarios", "agent", "agent.detectors", "bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "site", "results", "cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "D1"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"bench/report.py" = ["E501"]  # long markdown table f-strings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
